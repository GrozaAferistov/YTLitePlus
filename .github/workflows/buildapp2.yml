name: Build 

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version (e.g., 17.5)"
        default: "17.5"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube ipa"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload iPA as artifact (Public)"
        default: false
        required: false
        type: boolean
      catbox_upload:
        description: "Upload iPA to Catbox.moe (URL)"
        default: true
        required: false
        type: boolean
      create_release:
        description: "Create a draft release (Private)"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTLitePlus
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: brew install ldid dpkg make jq

      - name: Download Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: iOS SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          # Download specific SDK version from aricloverALT/sdks
          git clone -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Download Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos
        
      - name: Fix Compiling
        run: |
          # Update GNU Make to allow for faster building
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          (echo export PATH="/usr/local/opt/make/libexec/gnubin:$PATH" >> ~/.bash_profile)
          source ~/.bash_profile

      - name: Validate Inputs
        run: |
          if [[ -z "${{ inputs.decrypted_youtube_url }}" ]]; then
            echo "Error: Decrypted YouTube URL is required."
            exit 1
          fi
          # Mask the URL in logs for security
          echo "::add-mask::${{ inputs.decrypted_youtube_url }}"

      - name: Prepare YouTube iPA
        run: |
          # Download and unzip iPA
          wget "${{ inputs.decrypted_youtube_url }}" --quiet --no-verbose -O main/YouTube.ipa
          unzip -q main/YouTube.ipa -d main/tmp
          
          # Get the version number of the YouTube app
          YT_VERSION=$(defaults read ${GITHUB_WORKSPACE}/main/tmp/Payload/YouTube.app/Info.plist CFBundleShortVersionString)
          echo "YT_VERSION=$YT_VERSION" >> $GITHUB_ENV
          
          # Get the version number of the latest YTLite release via API
          YTLITE_VERSION=$(curl -s https://api.github.com/repos/dayanch96/YTLite/releases/latest | jq -r '.tag_name' | sed 's/v//')
          
          if [[ -z "$YTLITE_VERSION" || "$YTLITE_VERSION" == "null" ]]; then
             echo "Failed to fetch YTLite version, defaulting to 5.0.0"
             YTLITE_VERSION="5.0.0"
          fi
          
          echo "YTLITE_VERSION=$YTLITE_VERSION" >> $GITHUB_ENV
          echo "Detected YouTube: $YT_VERSION"
          echo "Detected YTLite: $YTLITE_VERSION"

          # Remove contents in the iPA that interfere with sideloading
          rm -rf main/tmp/Payload/YouTube.app/_CodeSignature/CodeResources
          rm -rf main/tmp/Payload/YouTube.app/PlugIns/*
          
          # Modify Info.plist to remove UISupportedDevices
          python3 - <<EOF
          import plistlib
          import os

          filepath = 'main/tmp/Payload/YouTube.app/Info.plist'
          if os.path.exists(filepath):
              with open(filepath, 'rb') as f:
                  plist = plistlib.load(f)

              if 'UISupportedDevices' in plist:
                  del plist['UISupportedDevices']
                  print("Removed UISupportedDevices")

              with open(filepath, 'wb') as f:
                  plistlib.dump(plist, f)
          else:
              print("Info.plist not found!")
          EOF

          # Manually install the Open in YouTube extension
          if [ -d "main/Extensions" ]; then
            cp -R main/Extensions/*.appex main/tmp/Payload/YouTube.app/PlugIns 2>/dev/null || true
          fi
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build Package
        id: build_package
        run: |
          cd ${{ github.workspace }}/main
          
          # Modify Makefile
          sed -i '' "s/^.*BUNDLE_ID.*$/BUNDLE_ID = ${{ inputs.bundle_id }}/" Makefile
          sed -i '' "s/^.*DISPLAY_NAME.*$/DISPLAY_NAME = ${{ inputs.app_name }}/" Makefile
          sed -i '' "s/^.*PACKAGE_VERSION.*$/PACKAGE_VERSION = ${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }}/" Makefile
          
          # Check if the specific SDK exists
          SDK_PATH="${{ github.workspace }}/theos/sdks/iPhoneOS${{ inputs.sdk_version }}.sdk"
          if [ ! -d "$SDK_PATH" ]; then
             echo "Error: SDK not found at $SDK_PATH"
             ls -R ${{ github.workspace }}/theos/sdks
             exit 1
          fi

          # Build the package with overrides
          # -fno-modules fixes the "declaration must be imported from module" errors in YTUHD
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 \
            TARGET="iphone:clang:${{ inputs.sdk_version }}:15.0" \
            SDK_PATH="$SDK_PATH" \
            _THEOS_TARGET_CFLAGS="-fno-modules"
          
          # Get the generated IPA name
          PKG_NAME=$(ls -t packages | head -n1)
          
          # Rename for clarity
          NEW_PKG_NAME="YTLitePlus_${{ env.YT_VERSION }}_${{ env.YTLITE_VERSION }}.ipa"
          mv "packages/$PKG_NAME" "packages/$NEW_PKG_NAME"
          
          echo "package=$NEW_PKG_NAME" >> $GITHUB_OUTPUT
          
          echo -e "==> \033[1mSHASUM256: $(shasum -a 256 packages/$NEW_PKG_NAME | cut -f1 -d' ')\033[0m"
          echo -e "==> \033[1mBundle ID: ${{ inputs.bundle_id }}\033[0m"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: YTLitePlus_${{ env.YT_VERSION }}_${{ env.YTLITE_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}
          if-no-files-found: error
          
      - name: Upload Artifact to Catbox and update AltStore repo
        if: ${{ inputs.catbox_upload }}
        run: |
          FILE_PATH="${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}"
          if [ -f "$FILE_PATH" ]; then
            RESPONSE=$(curl -F "reqtype=fileupload" -F "fileToUpload=@$FILE_PATH" https://catbox.moe/user/api.php)
            CATBOX_URL=$(echo $RESPONSE | grep -o -E 'https://files.catbox.moe/[^"]*')
            
            if [[ "$CATBOX_URL" == http* ]]; then
              echo "Uploaded artifact to $CATBOX_URL"
              CATBOX_FILE=$(echo $CATBOX_URL | sed 's|https://files.catbox.moe/||')
              echo "CATBOX_FILE=$CATBOX_FILE" >> $GITHUB_ENV
              echo "CATBOX_URL=$CATBOX_URL" >> $GITHUB_ENV
            else
              echo "Catbox upload failed: $RESPONSE"
            fi
          else
            echo "File to upload not found."
          fi
      
      - name: Prepare Release Notes
        if: ${{ inputs.create_release }}
        run: |
          export TODAY=$(date '+%Y-%m-%d')
          sed "s/%ytliteplus_version%/${{ env.YTLITE_VERSION }}/g; s/%youtube_version%/${{ env.YT_VERSION }}/g; s/%catbox_url%/${{ env.CATBOX_FILE }}/g; s/%date%/$TODAY/g" \
          main/.github/RELEASE_TEMPLATE/Release.md > ${{ github.workspace }}/release_notes.md

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }}
          name: v${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }} - YTLitePlus
          files: main/packages/*.ipa
          draft: true
          body_path: ${{ github.workspace }}/release_notes.md

      - name: Update Altstore Source with latest release
        if: ${{ inputs.catbox_upload }}
        run: |
          # Only run if a token is provided and Catbox upload succeeded
          if [[ -n "${{ secrets.PERSONAL_ACCESS_TOKEN }}" && -n "${{ env.CATBOX_URL }}" ]]; then
            curl --location --request POST 'https://api.github.com/repos/Balackburn/YTLitePlusAltstore/actions/workflows/update_source.yml/dispatches' \
            --header 'Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}' \
            --header 'Content-Type: application/json' \
            --data-raw '{
              "ref": "main",
              "inputs": {
                "yt_lite_plus_url": "${{ env.CATBOX_URL }}",
                "yt_lite_plus_version": "${{ env.YTLITE_VERSION }}",
                "yt_version": "${{ env.YT_VERSION }}"
              }
            }'
          else
             echo "Skipping AltStore update: Missing Token or Catbox URL."
          fi

      - name: Job Summary
        run: |
          echo -e '### 📺 Build Complete' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Artifact Upload
        if: ${{ inputs.upload_artifact }}
        run: |
          echo -e '### 📦 Artifact Upload\n\nThe artifact was uploaded successfully! Refresh and [scroll down](#artifacts) to view the artifact. Note that you must be signed in to GitHub to download it.' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Catbox Upload
        if: ${{ inputs.catbox_upload && env.CATBOX_URL }}
        run: |
          echo -e '### 🐱 Catbox Upload\n\nThe Catbox upload was successful! Here is a permanent shareable link: ${{ env.CATBOX_URL }}' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Draft Release
        if: ${{ inputs.create_release }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          RELEASES_URL="$REPO_URL/releases"
          echo -e '### 🚀 Draft Release\n\nThe release draft has been created successfully! You can view your releases here: '$RELEASES_URL >> $GITHUB_STEP_SUMMARY
