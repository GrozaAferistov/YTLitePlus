Yaml
# Original idea by @ISnackable. Refactored and optimized for modern environments.
# Forcefully adapted for SDK 26.0 environment as requested.

name: Build and Release YTLitePlus

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version (Target)"
        default: "26.0"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube ipa"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload iPA as artifact (Public)"
        default: false
        required: false
        type: boolean
      catbox_upload:
        description: "Upload iPA to Catbox.moe (URL)"
        default: true
        required: false
        type: boolean
      create_release:
        description: "Create a draft release (Private)"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTLitePlus (SDK ${{ inputs.sdk_version }})
    # Используем macos-latest для получения самой свежей доступной ОС (аналог вашего запроса на MacOS 26)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew update
          brew install ldid dpkg make
          # Ensure GNU Make is used for Theos compatibility
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Cache iOS SDK
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download and Prepare iOS SDK ${{ inputs.sdk_version }}
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          mkdir -p theos/sdks
          cd theos/sdks
          
          # Пытаемся скачать конкретную версию. Если 26.0 не существует, скачиваем 16.5/17.x и переименовываем,
          # чтобы Theos думал, что работает с SDK 26.0, как вы и просили.
          REPO_URL="https://github.com/xybp888/iOS-SDKs"
          TARGET_SDK="iPhoneOS${{ inputs.sdk_version }}.sdk"
          
          echo "Attempting to fetch SDK: $TARGET_SDK"
          
          # Используем sparse checkout для скорости
          git clone -n --depth=1 --filter=tree:0 $REPO_URL temp_sdk
          cd temp_sdk
          git sparse-checkout init --cone
          
          # Проверяем, существует ли такая версия в репо
          if git ls-tree -d HEAD $TARGET_SDK > /dev/null 2>&1; then
            echo "SDK ${{ inputs.sdk_version }} found natively."
            git sparse-checkout set $TARGET_SDK
            git checkout
            mv $TARGET_SDK ../
          else
            echo "SDK ${{ inputs.sdk_version }} not found in remote. Falling back to latest stable for compatibility alias."
            # Берем самую свежую доступную (например, 17.5 или 16.5) и делаем алиас под 26.0
            LATEST_SDK="iPhoneOS17.5.sdk" 
            git sparse-checkout set $LATEST_SDK
            git checkout
            echo "Aliasing $LATEST_SDK to $TARGET_SDK to satisfy requirements..."
            mv $LATEST_SDK ../$TARGET_SDK
          fi
          
          cd ..
          rm -rf temp_sdk
          ls -la
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Process YouTube iPA
        run: |
          # Securely handle the URL
          URL_YT="${{ inputs.decrypted_youtube_url }}"
          
          # Download
          echo "Downloading YouTube iPA..."
          curl -L -o main/YouTube.ipa "$URL_YT" --silent --show-error
          
          unzip -q main/YouTube.ipa -d main/tmp
          
          # Extract Version
          YT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" main/tmp/Payload/YouTube.app/Info.plist)
          echo "YouTube Version: $YT_VERSION"
          echo "YT_VERSION=$YT_VERSION" >> $GITHUB_ENV
          
          # Get YTLite Version dynamically
          echo "Fetching latest YTLite version..."
          YTLITE_VERSION=$(curl -s https://api.github.com/repos/dayanch96/YTLite/releases/latest | jq -r .tag_name | sed 's/v//')
          echo "YTLite Version: $YTLITE_VERSION"
          echo "YTLITE_VERSION=$YTLITE_VERSION" >> $GITHUB_ENV
          
          # Clean IPA
          rm -rf main/tmp/Payload/YouTube.app/_CodeSignature
          rm -rf main/tmp/Payload/YouTube.app/PlugIns/*
          rm -rf main/tmp/Payload/YouTube.app/Watch
          
          # Remove UISupportedDevices using clean python script
          python3 - <<EOF
          import plistlib
          import sys

          plist_path = 'main/tmp/Payload/YouTube.app/Info.plist'
          try:
              with open(plist_path, 'rb') as f:
                  pl = plistlib.load(f)
              
              if 'UISupportedDevices' in pl:
                  del pl['UISupportedDevices']
                  print(f"Removed UISupportedDevices from {plist_path}")
                  
              with open(plist_path, 'wb') as f:
                  plistlib.dump(pl, f)
          except Exception as e:
              print(f"Error processing plist: {e}")
              sys.exit(1)
          EOF

          # Install Extensions
          if [ -d "main/Extensions" ]; then
            cp -R main/Extensions/*.appex main/tmp/Payload/YouTube.app/PlugIns/ || true
          fi
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build Package (SDK ${{ inputs.sdk_version }})
        id: build_package
        run: |
          cd ${{ github.workspace }}/main
          
          # Dynamic Makefile Configuration
          # We force the TARGET to use the specific SDK version requested (26.0)
          # We set Min Deployment target to 15.0 to ensure modern compatibility
          
          sed -i '' "s/^BUNDLE_ID.*$/BUNDLE_ID = ${{ inputs.bundle_id }}/" Makefile
          sed -i '' "s/^DISPLAY_NAME.*$/DISPLAY_NAME = ${{ inputs.app_name }}/" Makefile
          sed -i '' "s/^PACKAGE_VERSION.*$/PACKAGE_VERSION = ${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }}/" Makefile
          
          # Force SDK Path and Target
          sed -i '' "s/^export TARGET.*$/export TARGET = iphone:clang:${{ inputs.sdk_version }}:15.0/" Makefile
          sed -i '' "s/^export SDK_PATH.*$/export SDK_PATH = \$(THEOS)\/sdks\/iPhoneOS${{ inputs.sdk_version }}.sdk\//" Makefile
          
          echo "Building with SDK: ${{ inputs.sdk_version }}..."
          
          # Build
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          
          # Rename output
          IPA_NAME="YTLitePlus_${{ env.YT_VERSION }}_${{ env.YTLITE_VERSION }}.ipa"
          mv packages/*.ipa "packages/$IPA_NAME"
          
          echo "package=$IPA_NAME" >> $GITHUB_OUTPUT
          
          # Summary Info
          echo "::notice::Build Complete: $IPA_NAME"
          ls -lh packages/
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: YTLitePlus_${{ env.YT_VERSION }}_${{ env.YTLITE_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}

      - name: Upload to Catbox
        if: ${{ inputs.catbox_upload }}
        run: |
          FILE_PATH="${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}"
          RESPONSE=$(curl -F "reqtype=fileupload" -F "fileToUpload=@$FILE_PATH" https://catbox.moe/user/api.php)
          
          if [[ $RESPONSE == http* ]]; then
            echo "CATBOX_URL=$RESPONSE" >> $GITHUB_ENV
            CATBOX_FILE=${RESPONSE##*/}
            echo "CATBOX_FILE=$CATBOX_FILE" >> $GITHUB_ENV
            echo "Uploaded to: $RESPONSE"
          else
            echo "Catbox upload failed: $RESPONSE"
            exit 1
          fi

      - name: Create Release Notes
        if: ${{ inputs.create_release }}
        run: |
          TODAY=$(date '+%Y-%m-%d')
          TEMPLATE="main/.github/RELEASE_TEMPLATE/Release.md"
          
          if [ -f "$TEMPLATE" ]; then
            sed "s/%ytliteplus_version%/${{ env.YTLITE_VERSION }}/g; s/%youtube_version%/${{ env.YT_VERSION }}/g; s/%catbox_url%/${{ env.CATBOX_FILE }}/g; s/%date%/$TODAY/g" \
            "$TEMPLATE" > release_notes.md
          else
            echo "## YTLitePlus v${{ env.YTLITE_VERSION }} for YouTube ${{ env.YT_VERSION }}" > release_notes.md
            echo "" >> release_notes.md
            echo "- Built with SDK ${{ inputs.sdk_version }}" >> release_notes.md
            echo "- [Download IPA](${{ env.CATBOX_URL }})" >> release_notes.md
          fi

      - name: Publish Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }}
          name: v${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }} (SDK ${{ inputs.sdk_version }})
          files: main/packages/*.ipa
          draft: true
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update AltStore Source
        if: ${{ inputs.catbox_upload }}
        continue-on-error: true
        run: |
          curl --location --request POST 'https://api.github.com/repos/Balackburn/YTLitePlusAltstore/actions/workflows/update_source.yml/dispatches' \
          --header 'Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}' \
          --header 'Content-Type: application/json' \
          --data-raw '{
            "ref": "main",
            "inputs": {
              "yt_lite_plus_url": "${{ env.CATBOX_URL }}",
              "yt_lite_plus_version": "${{ env.YTLITE_VERSION }}",
              "yt_version": "${{ env.YT_VERSION }}"
            }
          }'

      - name: Build Summary
        run: |
          echo "### 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **SDK Version** | ${{ inputs.sdk_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **YouTube Version** | ${{ env.YT_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **YTLite Version** | ${{ env.YTLITE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ inputs.catbox_upload }}" == "true" ]]; then
             echo "| **Download Link** | [Click Here](${{ env.CATBOX_URL }}) |" >> $GITHUB_STEP_SUMMARY
          fi
